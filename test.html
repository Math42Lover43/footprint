<!DOCTYPE html>
<html>
	<head>
		<title>
			Footprint
		</title>
		<meta charset="utf-8">
		<style>
			body, textarea, button {
				font-family: 'Arial';
			}
			button {
				border: 0pt;
				border-radius: 5pt;
			}
		</style>
	</head>
	<body>
		<table id="data">
			<tr>
				<td>
					Token
				</td>
				<td>
					Text
				</td>
			</tr>
		</table>
		<textarea style="width: 100%" id="sub" placeholder="Type text here"></textarea>
		<br/>
		<button onclick="Fingerprint.submit(document.getElementById('sub').value)">
			Submit
		</button>
		<hr/>
		<table style="font-size: 7pt;">
			<tr>
				<td>
					1.1.0
				</td>
				<td>
					Tokens added
				</td>
			</tr>
			<tr>
				<td>
					1.0.1
				</td>
				<td>
					Tokens added
				</td>
			</tr>
			<tr>
				<td>
					1.0.0
				</td>
				<td>
					Created!
				</td>
			</tr>
		</table>
	</body>
	<script>
		Fingerprint = {
			"submit": function(x) {
				document.getElementById("data").innerHTML += `
					<tr>
						<td>
							${Fingerprint.token(20)}
						</td>
						<td>
							${x}
						</td>
					</tr>
				`;
			},
			"match": function(x, y) {
				var X = [];
				var Y = [];
				for(let a = 0; a < x.length - 1; a++) {
					for(let b = a + 1; b < x.length; b++) {
						X.push(x.slice(a, b));
					}
				}
				for(let a = 0; a < y.length - 1; a++) {
					for(let b = a + 1; b < y.length; b++) {
						Y.push(y.slice(a, b));
					}
				}
				return Y.filter(x => X.includes(x)).length / Y.length;
			}
			"token": function(x) {
				var ret = "&";
				for(let i = 0; i < x; i++) {
					ret += "0123456789qwertyuiopasdfghjklzxcvbnm"[Math.floor(Math.random() * 36)];
				}
				return ret;
			}
		};
	</script>
</html>
