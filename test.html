<!DOCTYPE html>
<html>
	<head>
		<title>
			Footprint
		</title>
		<meta charset="utf-8">
		<style>
			body, textarea, button {
				font-family: 'Arial';
			}
			button {
				border: 0pt;
				border-radius: 5pt;
			}
		</style>
	</head>
	<body>
		<table id="data">
			<tr>
				<td>
					Token
				</td>
				<td>
					Text
				</td>
				<td>
					Match
				</td>
			</tr>
		</table>
		<textarea style="width: 100%" id="sub" placeholder="Type text here"></textarea>
		<br/>
		<button onclick="Fingerprint.submit(document.getElementById('sub').value)">
			Submit
		</button>
		<hr/>
		<table style="font-size: 7pt;">
			<tr>
				<td>
					1.1.3
				</td>
				<td>
					Matching to first string
				</td>
			</tr>
			<tr>
				<td>
					1.1.2
				</td>
				<td>
					Exponential divisor for matching function
				</td>
			</tr>
			<tr>
				<td>
					1.1.1
				</td>
				<td>
					Matching function additions are substring length-dependent
				</td>
			</tr>
			<tr>
				<td>
					1.1.0
				</td>
				<td>
					Matching function added
				</td>
			</tr>
			<tr>
				<td>
					1.0.1
				</td>
				<td>
					Tokens added
				</td>
			</tr>
			<tr>
				<td>
					1.0.0
				</td>
				<td>
					Created!
				</td>
			</tr>
		</table>
	</body>
	<script>
		var data = [];
		Fingerprint = { // Edit this function to use the data how you want
			"submit": function(x) {
				data.push({
					"id": Fingerprint.token(20),
					"text": x,
					"match_quan": data[0] ? Math.round(Fingerprint.match(data[0].text, x) * 100) : "--",
					"match_qual": data[0] ? data[0].id : "--",
				});
				document.getElementById("data").innerHTML += `
					<tr>
						<td>
							${data[data.length - 1].id}
						</td>
						<td>
							${data[data.length - 1].text}
						</td>
						<td>
							${data[data.length - 1].match_quan}% ${data[data.length - 1].match_qual}
						</td>
					</tr>
				`;
			},
			"match": function(x, y) {
				var X = [];
				var Y = [];
				for(let a = 0; a < x.length; a++) {
					for(let b = a + 1; b <= x.length; b++) {
						X.push(x.slice(a, b));
					}
				}
				for(let a = 0; a < y.length; a++) {
					for(let b = a + 1; b <= y.length; b++) {
						Y.push(y.slice(a, b));
					}
				}
				console.log(Y);
				var x_total = 0;
				for(let a = 1; a <= x.length; a++) {
					x_total += (x.length + 1 - a) / (2 ** a);
				}
				var y_total = 0;
				for(let a = 1; a < Y.length; a++) {
					y_total += X.includes(Y[a]) / (2 ** Y[a].length);
				}
				return y_total / x_total;
			},
			"token": function(x) {
				var ret = "&";
				for(let i = 0; i < x; i++) {
					ret += "0123456789qwertyuiopasdfghjklzxcvbnm"[Math.floor(Math.random() * 36)];
				}
				return ret;
			}
		};
	</script>
</html>
